name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    name: Backend Import Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install fastapi uvicorn httpx bcrypt python-jose anthropic "pydantic[email]"

      - name: Verify all modules import cleanly
        run: |
          python -c "import cost_controls; print('cost_controls OK')"
          python -c "import specialists; print('specialists OK')"
          python -c "import agent_runner; print('agent_runner OK')"
          python -c "import dev_server; print('dev_server OK')"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
